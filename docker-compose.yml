version: '3.9'

services:

  api:
    build: ./backend
    container_name: poker_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: poker_postgres
    restart: always
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: pokerpassword
      POSTGRES_DB: pokermoskva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: poker_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: